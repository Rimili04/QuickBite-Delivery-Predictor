<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Under Maintenance</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }
        .container {
            max-width: 600px;
            width: 100%;
        }
        .message-group {
            margin-bottom: 40px;
        }
        .message-item {
            position: relative;
            padding-left: 24px;
            margin-bottom: 28px;
            font-size: 24px;
            font-weight: 400;
            line-height: 1.4;
        }
        .message-item::before {
            content: "";
            position: absolute;
            left: 0;
            top: 4px;
            bottom: 4px;
            width: 2px;
        }
        .item-main {
            font-weight: 600;
        }
        .item-main::before {
            background-color: #ff007a; /* The pink/red accent line */
        }
        .item-sub::before {
            background-color: #0070f3; /* The blue accent line */
        }
        .card {
            border: 1px solid #eaeaea;
            border-radius: 5px;
            padding: 24px;
            margin-bottom: 24px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .card-code {
            font-size: 13px;
            color: #000000;
            line-height: 1.6;
        }
        .code-bg {
            background-color: #fafafa;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #eaeaea;
        }
        .footer {
            font-size: 14px;
            color: #666666;
            padding-left: 12px;
            position: relative;
        }
        .footer::before {
            content: "–";
            position: absolute;
            left: 0;
            color: #999999;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="message-group">
            <div class="message-item item-main">
                This Site is under scheduled maintenance.
            </div>
            <div class="message-item item-sub">
                Our team is working correctly.
            </div>
            <div class="message-item item-sub">
                We will be back online shortly.
            </div>
        </div>

        <div class="card">
            <div class="card-title">503: SERVICE_UNAVAILABLE</div>
            <div class="card-code">
                Code: <span class="code-bg">`SITE_MAINTENANCE`</span>
            </div>
        </div>

        <div class="footer">
            If you are a visitor, please try again later.
        </div>
    </div>

</body>
</html>
