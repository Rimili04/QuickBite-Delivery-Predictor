
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickBite | Coming Back Soon</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #fff8f4;
      color: #172033;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    main { max-width: 560px; }
    .logo {
      display: inline-block;
      background: #f45155;
      color: white;
      padding: 16px;
      border-radius: 18px;
      font-weight: bold;
      margin-bottom: 24px;
    }
    h1 { font-size: clamp(34px, 6vw, 52px); margin: 0 0 16px; }
    p { color: #667085; font-size: 17px; line-height: 1.8; }
    .status {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 16px;
      border: 1px solid #f4d7ca;
      border-radius: 24px;
      background: white;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">QuickBite</div>
    <h1>We'll be back soon.</h1>
    <p>
      We're making a few improvements to QuickBite.
      Thank you for your patience. Please check back later!
    </p>
    <div class="status">Temporarily under maintenance</div>
  </main>
</body>
</html>
